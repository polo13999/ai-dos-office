name: Office Dependency Hardening Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-dependency-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: work/work-office-dependency-hardening-0001-gpt56

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Regenerate portable lockfile
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          if grep -q 'packages.applied-caas-gateway1.internal.api.openai.org' package-lock.json; then
            echo 'Internal registry URL remains in lockfile.' >&2
            exit 1
          fi

      - name: Install from regenerated lockfile
        run: npm ci --no-audit --no-fund --registry=https://registry.npmjs.org

      - name: Compile focused queue validation
        run: npx tsc -p tsconfig.queue-service-validation.json

      - name: Run focused service and API validation
        run: node .queue-service-validation/tests/queues/service-api-validation.js

      - name: Build Office application
        run: npm run build

      - name: Persist portable lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo 'Portable lockfile already matches generated output.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'Regenerate portable public npm lockfile'
          git push origin HEAD:work/work-office-dependency-hardening-0001-gpt56
